<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=https://drive.google.com/file/d/1K5PLDmwIATDxABHy1sdpaUrGtPnWmIgS/view?usp=sharing">
  <title>Redirecting to Download...</title>
  <style>
    body {
      background-color: #0b0b0c;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .container {
      max-width: 480px;
      padding: 40px 30px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
    }
    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #ffffff 0%, #a1a1aa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #a1a1aa;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 24px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #ffffff;
      color: #09090b;
      padding: 12px 24px;
      border-radius: 9999px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      font-size: 14px;
      box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
    }
    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h1>Redirecting to Download</h1>
    <p>We are redirecting you to Google Drive to download <strong>clap_models.zip</strong>. If the download does not start automatically, please click the button below.</p>
    <a href="https://drive.google.com/file/d/1K5PLDmwIATDxABHy1sdpaUrGtPnWmIgS/view?usp=sharing" class="btn">Click here to download</a>
  </div>

  <script>
    setTimeout(function() {
      window.location.href = "https://drive.google.com/file/d/1K5PLDmwIATDxABHy1sdpaUrGtPnWmIgS/view?usp=sharing";
    }, 100);
  </script>
</body>
</html>
