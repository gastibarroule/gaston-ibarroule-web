<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sonidata — Connecting to Freesound</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #1a1a2e;
            color: #e0e0e0;
        }
        .card {
            text-align: center;
            padding: 2rem;
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            max-width: 360px;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #ff6b35;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        p { opacity: 0.7; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner"></div>
        <h2>Redirecting to Sonidata…</h2>
        <p>If the app doesn't open automatically, <a id="manual" href="#" style="color:#ff6b35;">tap here</a>.</p>
    </div>
    <script>
        // Grab the full query string from Freesound's redirect
        var params = window.location.search; // e.g. ?code=XXX&state=YYY
        var deepLink = 'sonidata://freesound/callback' + params;
        
        // Set the manual link
        document.getElementById('manual').href = deepLink;
        
        // Auto-redirect to the app's custom URL scheme
        window.location.replace(deepLink);
    </script>
</body>
</html>
